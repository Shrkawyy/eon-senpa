<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />

  <title>EON Senpa | Userscript</title>
  <style>
    :root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#f4f5f8;background:#080b13}

    a{color:#dbe5ff;text-decoration:none;padding:13px 18px;border-radius:10px;border:1px solid #3c4561;font-weight:650}
    a.primary{background:#4b6ae8;border-color:#4b6ae8;color:white}a:hover{filter:brightness(1.13)}small{display:block;color:#94a0be;line-height:1.6}

  </style>
</head>
<body>
 <main>
  <div class="mark">EON • SENPA</div>
  <h1>Senpa Userscript</h1>

  <div class="actions">
    <a class="primary" href="/Senpa-Recovered.user.js">Install userscript</a>
